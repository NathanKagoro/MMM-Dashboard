name: CI

# Tests and a production build on every pull request and on pushes to feature branches.
# main is built and deployed by pages.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: false
